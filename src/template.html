<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
</head>
<body>
    <nav class="navbar">
        <form action="" class="form">
            <input type="text" name="searchInput" class="form-input" placeholder="Search">
            <button type="button" class="search-btn">⌕</button>
        </form>
    </nav>
    <div class="location">Mumbai, <span class="meta">India</span></div>
    <div class="weather-icon">
        <img src="./assets/weather-icons/partly-cloudy-day.png" alt="weather-icon" class="icon-src" >
    </div>
    <div class="temp-desc">
        <div class="temperature">29' c</div>
        <div class="description">Expect high rain today</div>
    </div>
    <div class="stats">
        <div class="stat-item">--</div>
        <div class="stat-item">--</div>
        <div class="stat-item">--</div>
    </div>
    <div class="hourly-head">Hourly Forecast</div>
    <div class="hourly-section">
        <div class="hourly-forecast one"></div>
        <div class="hourly-forecast two"></div>
        <div class="hourly-forecast three"></div>
        <div class="hourly-forecast four"></div>
        <div class="hourly-forecast five"></div>
        <div class="hourly-forecast six"></div>
        <div class="hourly-forecast seven"></div>
        <div class="hourly-forecast eight"></div>
    </div>
</body>
</html>

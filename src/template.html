<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
</head>
<body>
    <nav class="navbar">
        <form action="" class="form">
            <input type="text" name="searchInput" class="form-input" placeholder="Search" required minlength="2" >
            <button type="submit" class="search-btn">
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="20" height="20" viewBox="0 0 256 256" xml:space="preserve">
                    <g style="stroke: none; stroke-width: 0; stroke-dasharray: none;    stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; fill: none; fill-rule: nonzero; opacity: 1;" transform="translate(1.4065934065934016 1.4065934065934016) scale(2.81 2.81)">
	                    <path d="M 79.055 10.945 c -14.593 -14.593 -38.253 -14.593 -52.847 0 c -12.026 12.026 -14.132 30.206 -6.337 44.398 L 0.4 74.815 c -0.533 0.533 -0.533 1.398 0 1.931 L 13.253 89.6 c 0.533 0.533 1.398 0.533 1.931 0 l 19.472 -19.472 c 14.192 7.795 32.372 5.69 44.398 -6.337 C 93.648 49.198 93.648 25.538 79.055 10.945 z M 36.473 53.527 c -8.924 -8.924 -8.924 -23.393 0 -32.317 s 23.393 -8.924 32.317 0 s 8.924 23.393 0 32.317 S 45.397 62.451 36.473 53.527 z" style="stroke: none; stroke-width: 1; stroke-dasharray: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; fill: rgb(0,0,0); fill-rule: nonzero; opacity: 1;" transform=" matrix(1 0 0 1 0 0) " stroke-linecap="round"/>
                    </g>
                </svg>
            </button>
        </form>
    </nav>
    <div class="location"></div>
    <div id="loader-dots" class="loader-dots hidden"></div>
    <div class="weather-icon">
        <img src="#" alt="" class="icon-src" >
    </div>
    <div class="temp-desc">
        <div class="temperature">--</div>
        <div class="description"></div>
        <div class="temp-toggle">
            <div class="celcious active"><sup>°</sup>C</div>
            <div class="farenheit"><sup>°</sup>F</div>
        </div>
    </div>
    <div class="stats">
        <div class="stat-item">
            <img src="./assets/windy.png" alt="wind-speed" height="25px" >
            <div class="wind-speed">--</div>
        </div>
        <div class="stat-item">
            <img src="./assets/humidity.png" alt="humidity" height="25px" >
            <div class="humidity">--</div>
        </div>
        <div class="stat-item">
            <img src="./assets/uv.png" alt="uv-index" height="25px" >
            <div class="uv-index">--</div>
        </div>
        <div class="stat-item">
            <img src="./assets/map.png" alt="time-zone icon" height="25px">
            <div class="time-zone">--</div>
        </div>
    </div>
    <div class="hourly-head"><img src="./assets/clock.png" alt="clock-icon" height="15px">  Daily Forecast</div>
    <div class="day-description"></div>
    <div class="hourly-section">
        <div class="daily-forecast one">
            <img src="#" alt="" height="60px" >
            <div class="time">Today</div>
            <div class="temp">--</div>
        </div>
        <div class="daily-forecast two">
            <img src="#" alt="" height="60px" >
            <div class="time day-two">Tomorrow</div>
            <div class="temp">--</div>
        </div>
        <div class="daily-forecast three">
            <img src="#" alt="" height="60px" >
            <div class="time">--</div>
            <div class="temp">--</div>
        </div>
        <div class="daily-forecast four">
            <img src="#" alt="" height="60px" >
            <div class="time">--</div>
            <div class="temp">--</div>
        </div>
        <div class="daily-forecast five">
            <img src="#" alt="" height="60px" >
            <div class="time">--</div>
            <div class="temp">--</div>
        </div>
        <div class="daily-forecast six">
            <img src="#" alt="" height="60px" >
            <div class="time">--</div>
            <div class="temp">--</div>
        </div>
        <div class="daily-forecast seven">
            <img src="#" alt="" height="60px" >
            <div class="time">--</div>
            <div class="temp">--</div>
        </div>
    </div>
</body>
</html>
